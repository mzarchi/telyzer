name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # 1. ساخت فایل secrets.rs فیک برای گیت‌هاب (باید اول باشه)
    - name: Create temporary secrets.rs for CI
      run: |
        echo 'pub const API_ID: i32 = 12345;' > core/src/secrets.rs
        echo 'pub const API_HASH: &str = "dummy_hash_for_ci";' >> core/src/secrets.rs

    # 2. نصب پیش‌نیازهای گرافیکی برای Iced (GUI)
    - name: Install Linux dependencies for Iced
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-x11-0 libwayland-dev libx11-dev libxcb1-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    # 3. چک کردن فرمت‌بندی
    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build
      run: cargo build --workspace

    - name: Run tests
      run: cargo test --workspace